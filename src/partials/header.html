<header class="sticky top-0 z-50 border-b border-ink-900/[0.06] bg-cream-100/90 backdrop-blur transition-transform duration-300 ease-in-out">
  <div class="mx-auto flex h-24 max-w-[1200px] items-center justify-between px-6">
    <a href="index.html" class="flex items-center gap-3">
      <img src="assets/img/logo/curie-logo.svg" alt="Curie Oncology - Spring Will Come" class="h-[62px] w-auto" />
    </a>

    <nav class="hidden items-center gap-8 lg:flex" aria-label="Primary">
      <a href="index.html" class="text-sm text-ink-700 hover:text-sage-700 {{NAV_HOME}}">Home</a>
      <a href="about.html" class="text-sm text-ink-700 hover:text-sage-700 {{NAV_ABOUT}}">About Us</a>
      <a href="meet-our-doctors.html" class="text-sm text-ink-700 hover:text-sage-700 {{NAV_DOCTORS}}">Doctors</a>
      <a href="our-services.html" class="text-sm text-ink-700 hover:text-sage-700 {{NAV_SERVICES}}">Oncology Services</a>
      <a href="health-education.html" class="text-sm text-ink-700 hover:text-sage-700 {{NAV_HEALTH}}">Health Education</a>
      <a href="index.html#contact" class="text-sm text-ink-700 hover:text-sage-700 {{NAV_CONTACT}}">Contact Us</a>
    </nav>

    <button
      type="button"
      id="nav-toggle"
      class="relative flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-ink-900 transition-colors duration-200 hover:bg-sage-50 active:bg-sage-100 lg:hidden"
      aria-expanded="false"
      aria-controls="mobile-nav"
      aria-label="Open menu"
    >
      <svg id="nav-icon-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <svg id="nav-icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hidden"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <div id="mobile-nav" class="mobile-nav lg:hidden" aria-hidden="true">
    <nav class="flex max-h-[calc(100vh-6rem)] flex-col overflow-y-auto divide-y divide-ink-900/[0.06] border-t border-ink-900/[0.06] bg-cream-100 px-6 shadow-lift" aria-label="Primary mobile" data-lenis-prevent>
      <a href="index.html" class="py-4 text-base text-ink-700 hover:text-sage-700 {{NAV_HOME}}">Home</a>
      <a href="about.html" class="py-4 text-base text-ink-700 hover:text-sage-700 {{NAV_ABOUT}}">About Us</a>
      <a href="meet-our-doctors.html" class="py-4 text-base text-ink-700 hover:text-sage-700 {{NAV_DOCTORS}}">Doctors</a>
      <a href="our-services.html" class="py-4 text-base text-ink-700 hover:text-sage-700 {{NAV_SERVICES}}">Oncology Services</a>
      <a href="health-education.html" class="py-4 text-base text-ink-700 hover:text-sage-700 {{NAV_HEALTH}}">Health Education</a>
      <a href="index.html#contact" class="py-4 text-base text-ink-700 hover:text-sage-700 {{NAV_CONTACT}}">Contact Us</a>
    </nav>
  </div>
</header>

<script>
  (function () {
    var toggle = document.getElementById('nav-toggle');
    var panel = document.getElementById('mobile-nav');
    var iconOpen = document.getElementById('nav-icon-open');
    var iconClose = document.getElementById('nav-icon-close');
    if (!toggle || !panel) return;

    function closeMenu() {
      panel.classList.remove('is-open');
      panel.setAttribute('aria-hidden', 'true');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Open menu');
      iconOpen.classList.remove('hidden');
      iconClose.classList.add('hidden');
    }

    function openMenu() {
      panel.classList.add('is-open');
      panel.setAttribute('aria-hidden', 'false');
      toggle.setAttribute('aria-expanded', 'true');
      toggle.setAttribute('aria-label', 'Close menu');
      iconOpen.classList.add('hidden');
      iconClose.classList.remove('hidden');
    }

    toggle.addEventListener('click', function () {
      if (panel.classList.contains('is-open')) closeMenu();
      else openMenu();
    });

    panel.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', closeMenu);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeMenu();
    });

    document.addEventListener('click', function (e) {
      if (!panel.classList.contains('is-open')) return;
      if (panel.contains(e.target) || toggle.contains(e.target)) return;
      closeMenu();
    });

    window.addEventListener('resize', function () {
      if (window.innerWidth >= 1024) closeMenu();
    });
  })();
</script>

<script>
  (function () {
    // Hide the header on scroll-down, reveal it on scroll-up - skipped
    // entirely under reduced motion so the nav just stays put as before.
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var header = document.querySelector('header');
    var mobileNav = document.getElementById('mobile-nav');
    if (!header) return;

    var lastY = window.scrollY;
    var threshold = 80;
    var ticking = false;

    function onScroll() {
      var currentY = window.scrollY;
      var navOpen = mobileNav && mobileNav.classList.contains('is-open');

      if (navOpen || currentY <= threshold || currentY < lastY) {
        header.classList.remove('-translate-y-full');
      } else if (currentY > lastY) {
        header.classList.add('-translate-y-full');
      }

      lastY = currentY;
      ticking = false;
    }

    window.addEventListener(
      'scroll',
      function () {
        if (!ticking) {
          window.requestAnimationFrame(onScroll);
          ticking = true;
        }
      },
      { passive: true }
    );
  })();
</script>
