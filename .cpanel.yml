---
# cPanel Git Version Control deploy (Deploy HEAD Commit).
# Copies the WordPress theme + site images into the staging WordPress install.
# DEPLOYPATH must match the staging subdomain's document root.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/staging.curieoncology.com.my/wp-content/themes/curie
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R wp-theme/curie/. $DEPLOYPATH/
    - /bin/cp -R assets $DEPLOYPATH/
