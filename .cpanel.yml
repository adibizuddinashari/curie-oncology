---
# cPanel Git Version Control deploy (Deploy HEAD Commit).
# Copies the WordPress theme + site images into the LIVE WordPress install
# (curieoncology.com.my, public_html). Deploy = cPanel Git: Update from Remote, then Deploy HEAD Commit.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/wp-content/themes/curie
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R wp-theme/curie/. $DEPLOYPATH/
    - /bin/cp -R assets $DEPLOYPATH/
